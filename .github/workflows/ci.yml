name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run codegen
      - run: npm run typecheck
      - run: npm run lint
      # Runs the whole suite once, and fails if coverage of the scheduler or
      # the resolver layer drops below the thresholds in vitest.config.ts.
      - run: npm run test:coverage
